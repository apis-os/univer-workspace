<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Univer Render</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script>
      document.documentElement.dataset.univerHtml = "1";
      (function () {
        function fakeHostname() { return "localhost"; }
        fakeHostname.__univerBuiltinAlias = true;
        try {
          Object.defineProperty(Location.prototype, "hostname", {
            configurable: true,
            enumerable: true,
            get: fakeHostname
          });
        } catch (err) {}
        try {
          Object.defineProperty(window.location, "hostname", {
            configurable: true,
            enumerable: true,
            get: fakeHostname
          });
        } catch (err2) {}
        try {
          window.location.__defineGetter__("hostname", fakeHostname);
        } catch (err3) {}
        try {
          var loc = window.location;
          delete window.location;
          window.location = new Proxy(loc, {
            get: function (target, key) {
              if (key === "hostname" || key === "host") return "localhost";
              var value = target[key];
              return typeof value === "function" ? value.bind(target) : value;
            }
          });
        } catch (err4) {}
      })();
      window.addEventListener("error", function (event) {
        document.documentElement.dataset.univerError = event.message || String(event);
      });
      window.addEventListener("unhandledrejection", function (event) {
        document.documentElement.dataset.univerError = String(event.reason);
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/render-main.tsx"></script>
  </body>
</html>
