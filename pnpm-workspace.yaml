packages:
  - apps/*
  - apps/agent/desktop
  - packages/*

# Like DSH's signer patch, skip Framework symlinks; also bound file probing
# for the external runtime. Remove once osx-sign fixes both in a release.
patchedDependencies:
  "@electron/osx-sign@1.3.3": patches/@electron__osx-sign@1.3.3.patch

allowBuilds:
  # electron-builder includes Squirrel tooling; desktop uses NSIS instead.
  electron-winstaller: false
  "@parcel/watcher": true
  esbuild: true
  protobufjs: true
  workerd: true

# This SDK release emits direct Redi type imports without declaring the
# dependency. Keep service identifiers in their host's React peer graph instead
# of resolving the workspace's hoisted copy. Prefer upstream declaration output
# that references DI types through @univerjs/core. Remove each extension once
# published declarations no longer leak an undeclared direct Redi import, and
# clean installs/typechecks pass in both host React peer graphs.
packageExtensions:
  "@univerjs/engine-render@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs/sheets-ui@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs/thread-comment@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs-pro/boards-ui@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs-pro/slides-ui@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs-pro/collaboration@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"

  "@univerjs-pro/bases@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs-pro/boards@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs-pro/edit-history-ui@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs-pro/slides@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs/docs-ui@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs/drawing@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs/engine-formula@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs/sheets@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs/sheets-conditional-formatting@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs/sheets-filter@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs/sheets-formula@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs/sheets-numfmt@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  "@univerjs/sheets-table@1.0.0-insiders.20260907-70fc579":
    dependencies:
      "@wendellhu/redi": "1.1.2"
  # Router declarations import React types but omit the type peer. Bind them to
  # the consuming application's React major; remove once upstream declares it.
  "@tanstack/react-router@1.170.31":
    peerDependencies:
      "@types/react": ">=18 <20"
    peerDependenciesMeta:
      "@types/react":
        optional: true

# The Univer SDK and DSH release trains are pinned to exact releases and may be
# updated on release day; only these selected scopes are exempt from
# minimumReleaseAge.
minimumReleaseAgeExclude:
  - "@deepseek-ai/cordis@4.0.2"
  - "@deepseek-ai/dsh*"
  - "@deepseek-ai/schemastery@3.18.2"
  - "@univer-cli/*"
  - "@univerjs/*"
  - "@univerjs-pro/*"
  - "@oxfmt/binding-android-arm-eabi@0.66.0"
  - "@oxfmt/binding-android-arm64@0.66.0"
  - "@oxfmt/binding-darwin-arm64@0.66.0"
  - "@oxfmt/binding-darwin-x64@0.66.0"
  - "@oxfmt/binding-freebsd-x64@0.66.0"
  - "@oxfmt/binding-linux-arm-gnueabihf@0.66.0"
